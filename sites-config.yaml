contexts:
  testnet:
    # module: site
    # portal: wal.app
    package: 0x22b8c1496650eb45fbcca0f8f37fae77ed33b7d4eaab4da5f0bb9b62a8708dcb
    staking_object: 0xbe46180321c30aab2f8b3501e24048377287fa708018a5b7c2792b35fe339ee3
    general:
       wallet_env: testnet
       walrus_context: testnet # Assumes a Walrus CLI setup with a multi-config containing the "testnet" context.
       walrus_package: 0xa998b8719ca1c0a6dc4e24a859bbb39f5477417f71885fbf2967a6510f699144
       # wallet_address: 0x1234...
       # rpc_url: https://fullnode.testnet.sui.io:443
       # wallet: /path/to/.sui/sui_config/client.yaml
       # walrus_binary: /path/to/walrus
       # walrus_config: /path/to/testnet/client_config.yaml
       # gas_budget: 500000000
  mainnet:
    # module: site
    # portal: wal.app
    package: 0x5a0c509a659ba982f91ff1189872b8d528f8c02b5f6285a3931fc4c2869ccc9c
    staking_object: 0x10b9d30c28448939ce6c4d6c6e0ffce4a7f8a4ada8248bdad09ef8b70e4a3904
    general:
       wallet_env: mainnet
       walrus_context: mainnet # Assumes a Walrus CLI setup with a multi-config containing the "mainnet" context.
       walrus_package: 0x98da433aa0139512c210597b1c5e3df6cd121d8d77f8652691bb66fadfc8aa1b
       # wallet_address: 0x1234...
       # NOTE: site-builder and walrus need DIFFERENT endpoints — do not unify.
       #   * site-builder's own Sui client (gas estimation, the site PTB) still
       #     speaks JSON-RPC, which Mysten's public fullnode turned off
       #     2026-07-31 -> "Method not found ... deprecated". ZAN still serves it.
       #   * the walrus subprocess (>=1.55) is gRPC-only and 404s on ZAN
       #     ("invalid compression flag") -> it points at Mysten via
       #     ~/.config/walrus/client_config.yaml :: contexts.mainnet.rpc_urls.
       # See docs/RPC_MIGRATION.md + docs/HOW_TO_DEPLOY_WALRUS_SITE.md.
       # MUST be a gRPC fullnode. This URL feeds site-builder's retriable client
       # AND is forwarded to the walrus subprocess as --rpc-url (overriding
       # ~/.config/walrus/client_config.yaml), and walrus >=1.55 is gRPC-only.
       # JSON-RPC-only providers (ZAN, blockvision, publicnode) 404 here with
       # "invalid compression flag".
       #
       # The ONE remaining JSON-RPC caller is site_manager::dry_run_ptb (the
       # --dry-run SUI gas estimate; site-builder 2.12 still marks it
       # "TODO(grpc-migration)"). It ignores this URL and builds its client from
       # the WALLET env instead, so ~/.sui/sui_config/client.yaml :: mainnet must
       # point at a JSON-RPC provider (ZAN) or --dry-run fails with
       # "Method not found ... deprecated". Real deploys never touch that path.
       # See docs/RPC_MIGRATION.md + docs/HOW_TO_DEPLOY_WALRUS_SITE.md.
       rpc_url: https://fullnode.mainnet.sui.io:443
       # wallet: /path/to/.sui/sui_config/client.yaml
       # walrus_binary: /path/to/walrus
       # walrus_config: /path/to/mainnet/client_config.yaml
       # site-builder needs ONE coin >= gas_budget to reserve. Real deploys cost
       # ~0.0085 SUI; 0.05 SUI keeps ~6x headroom and fits the deployer's single
       # ~0.095 SUI coin (2026-10-02). Raise it once the wallet is topped up.
       gas_budget: 50000000

default_context: mainnet
