# Portal configuration for testnet
# Copy this file to portal-config.yaml and adjust values as needed.
# Env vars override any value set here (for backward compatibility).

network: testnet
# IMPORTANT: this is the *original* package id where the walrus_site Move types
# were first declared, NOT the latest upgrade. Sui dynamic-field derivation
# (`<pkg>::site::ResourcePath` in resource.ts) is rooted at the original
# package across upgrades. Setting this to the latest `0x22b8c1…8dcb` makes
# the portal derive wrong field ids → every resource lookup 404s.
# The builder's `NEXT_PUBLIC_WALRUS_SITE_PACKAGE_ID` is intentionally a
# different value: it targets MoveCalls, which Sui resolves against any
# version of the package.
original_package_id: '0xf99aee9f21493e1590e7e5a9aea6f343a1f381031a04a732724871fc294be799'
landing_page_oid_b36: '1p3repujoigwcqrk0w4itsxm7hs7xjl4hwgt3t0szn6evad83q'

domain_name_length: 21
b36_domain_resolution: true
bring_your_own_domain: false
enable_blocklist: false
enable_allowlist: false

# Format: url, retries (>= 0), metric (lower = higher priority)
rpc_urls:
  - url: https://fullnode.testnet.sui.io
    retries: 2
    metric: 100

# Optional — required when enable_allowlist is true
# premium_rpc_urls:
#   - url: https://fullnode.testnet.sui.io
#     retries: 2
#     metric: 100

aggregator_urls:
  - url: https://aggregator.walrus-testnet.walrus.space
    retries: 3
    metric: 100
